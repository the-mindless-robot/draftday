<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      font-family: -apple-system, sans-serif;
      width: 200px;
      padding: 14px;
      margin: 0;
    }
    h3 { margin: 0 0 12px; font-size: 14px; }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      background: #16a34a;
      color: #fff;
    }
    button.active { background: #dc2626; }
    #status {
      margin-top: 8px;
      font-size: 11px;
      color: #666;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #ccc;
      flex-shrink: 0;
    }
    .dot.on { background: #16a34a; }
  </style>
</head>
<body>
  <h3>Draft Monster Sync</h3>
  <button id="toggle">Enable</button>
  <div id="status">
    <span class="dot" id="dot"></span>
    <span id="statusText">Disabled — open ESPN draft room first</span>
  </div>
  <script src="popup.js"></script>
</body>
</html>
